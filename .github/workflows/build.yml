name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check manifest.json
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open('manifest.json'))
          ids = [a['id'] for a in m['apps']]
          assert len(ids) == len(set(ids)), 'duplicate app ids'
          cats = {c['id'] for c in m['categories']}
          for a in m['apps']:
              for k in ('id', 'name', 'repo', 'exe', 'install'):
                  assert k in a, f"{a.get('id')}: missing {k}"
              assert a['install']['type'] in ('portable', 'nsis', 'velopack'), a['id']
              assert a['category'] in cats, f"{a['id']}: unknown category {a['category']}"
          print(f"manifest ok: {len(ids)} apps")
          PY

      - name: Install Zig
        run: pip install ziglang

      - name: Build Hangar.exe
        run: ./build.sh

      - name: Package
        run: |
          cp README.md dist/
          cd dist
          zip Hangar-win-x64.zip Hangar.exe README.md
          sha256sum Hangar.exe Hangar-win-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Hangar-win-x64
          path: |
            dist/Hangar.exe
            dist/SHA256SUMS.txt

      # A release is published automatically when HANGAR_VERSION in src/common.h changes on main
      # (or when a v* tag is pushed). Versions with a "-" such as 0.2.0-beta.1 are pre-releases (Beta).
      - name: Decide release
        id: rel
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'HANGAR_VERSION L"\K[^"]+' src/common.h)
          TAG="v$VER"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "Release $TAG already exists"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "Will publish $TAG"
          fi

      - name: Release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hangar ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.pre }}
          body_path: CHANGELOG-latest.md
          files: |
            dist/Hangar-win-x64.zip
            dist/Hangar.exe
            dist/SHA256SUMS.txt
